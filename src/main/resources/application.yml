server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: rota-leve
  profiles:
    default: demo
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  http:
    client:
      connect-timeout: 5s
      read-timeout: 90s
  ai:
    model:
      chat: ${AI_CHAT_MODEL:none}
      audio:
        speech: none
        transcription: none
      embedding: none
      image: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5:1.5b}
          temperature: 0.0
          seed: 42
          top-k: 20
          num-ctx: 2048
          num-predict: 160
          keep-alive: 5m
    retry:
      max-attempts: 2
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:rotaleve}
    password: ${RABBIT_PASSWORD:rotaleve-dev}
    connection-timeout: 5s
    listener:
      simple:
        auto-startup: ${rotaleve.rabbit.enabled:false}
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2
    template:
      mandatory: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      enabled: ${rotaleve.rabbit.enabled:false}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: false
rotaleve:
  cors:
    origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006,http://127.0.0.1:19006}
  fotos:
    diretorio: ${UPLOAD_DIRECTORY:data/fotos}
  jwt:
    secret: ${JWT_SECRET:rota-leve-chave-local-apenas-demo-com-mais-de-32-bytes}
  routes:
    provider: ${ROUTES_PROVIDER:demo}
  google:
    api-key: ${GOOGLE_MAPS_API_KEY:}
  rabbit:
    enabled: ${RABBIT_ENABLED:false}
  ai:
    enabled: ${AI_ENABLED:false}
