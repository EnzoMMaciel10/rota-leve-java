services:
  rabbitmq:
    image: rabbitmq:4.4.0-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-rotaleve}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-rotaleve-dev}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  ollama:
    profiles: [ia]
    image: ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    mem_limit: 4g
    cpus: 4
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DEMO_DATABASE_URL: jdbc:h2:file:/app/data/rotaleve;MODE=Oracle;DB_CLOSE_ON_EXIT=FALSE
      JWT_SECRET: ${JWT_SECRET:-rota-leve-chave-local-apenas-demo-com-mais-de-32-bytes}
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBIT_USER:-rotaleve}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-rotaleve-dev}
      RABBIT_ENABLED: "true"
      ROUTES_PROVIDER: ${ROUTES_PROVIDER:-demo}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - app-data:/app/data
volumes:
  rabbit-data:
  app-data:
  ollama-data:
